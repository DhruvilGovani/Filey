name: Unzip Repo
on:
  push:
    paths: ['Glimpse-repo.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -o Glimpse-repo.zip
          rm -f Glimpse-repo.zip
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .
          git commit -m "Extract Glimpse-repo.zip"
          git push
          
