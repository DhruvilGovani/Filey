name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Signed Release APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Prepare Glimpse.apk
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Glimpse.apk

      - name: Upload Glimpse.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Glimpse-apk
          path: out/Glimpse.apk

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: Glimpse v2.0.${{ github.run_number }}
          files: out/Glimpse.apk
          make_latest: true
