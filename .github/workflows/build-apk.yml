name: Build Glimpse APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare web directory
        run: |
          mkdir -p www
          cp index.html www/

      - name: Initialize Capacitor and build Android project
        run: |
          npm init -y
          npm pkg set name="glimpse"
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Glimpse" "com.dhruvilgovani.glimpse" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Glimpse v1.0.${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
          
