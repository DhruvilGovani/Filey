const NB=window.GlimpseNative||null,nat=(m,...a)=>{try{return NB?.[m]?.(...a)}catch(e){toast('Storage error: '+m)}};
window.__onZipDone=(kind,pj,name,ok)=>{if(!ok)return toast(kind==='zip'?'Compression failed':'Extraction failed');try{const p=JSON.parse(pj);if(cur.join('/')===p.join('/'))hydrate(p);loadRec();toast((kind==='zip'?'Created ':'Extracted to ')+name)}catch(e){}};
window.__onSizes=(pj,m)=>{try{const p=JSON.parse(pj),d=node(p);if(!d)return;d.c.forEach(x=>{if(x.c&&m[x.n]!=null)x._s=m[x.n]});if(cur.join('/')===p.join('/'))browse()}catch(e){}};
const loadRec=()=>NB&&NB.recent&&Promise.resolve(NB.recent(15)).then(l=>{nativeRec=l;home()}).catch(()=>{});
const hydrate=(p=cur)=>NB&&Promise.resolve(NB.list(p)).then(l=>{const d=node(p);d.c=l.map(x=>{if(x.dir){const sub=dir(x.n);sub._cnt=x.cnt||0;sub._s=x.s||0;sub.d=x.d||Date.now();return sub}return{n:x.n,s:x.s,d:x.d}});d._cnt=d.c.filter(x=>vis(x.n)).length;refresh();NB.calcSizes&&NB.calcSizes(p)}).catch(()=>toast('Could not read this folder'));
if(NB){requestAnimationFrame(()=>setTimeout(()=>{hydrate([]);loadRec();Promise.resolve(NB.info()).then(i=>{const g=b=>(b/1e9).toFixed(1),C={Apps:'#5b8cff',Videos:'#ff5d8f',Images:'#29d3a3',Audio:'#12a8c4',System:'#8a94a8',Archives:'#ffb84d',Documents:'#b57bff',Other:'#3ec6ff'};PC.length=0;i.breakdown.forEach(b=>PC.push([b.name,b.bytes/1e9,C[b.name]||'#3ec6ff']));$('#su').textContent=g(i.used)+' GB used';$('#sf').textContent=g(i.total-i.used)+' GB free of '+Math.round(i.total/1e9)+' GB';$('#fill').style.width=(i.used/i.total*100)+'%'})},20))}
apply(true);home();browse();setTimeout(()=>NB||($('#fill').style.width='53.4%'),200);
setTimeout(()=>NB&&NB.access&&!NB.access()||toast(NB?'Connected to this phone’s storage':'Demo data. A browser cannot read your files; install the Glimpse APK.'),1500);
if(NB&&NB.access&&!NB.access())setTimeout(()=>sheet(`<h3>Allow access to your files</h3><p class="mut">Glimpse needs the All files access permission to show your storage. Tap the button, switch Glimpse on in the Android screen that opens, then come back.</p><button class="pb glass tilt" id="ga">Open settings</button>`,h=>$('#ga',h).onclick=()=>NB.requestAccess()),800);
